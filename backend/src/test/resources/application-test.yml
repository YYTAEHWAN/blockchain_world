# ===== 테스트 전용 프로파일 =====
# 통합 테스트는 실제 파일 DB(local 프로파일)를 건드리지 않도록
# H2 인메모리 + create-drop 을 사용한다. (테스트 격리)
spring:
  datasource:
    url: jdbc:h2:mem:rwadb-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# 테스트에 필요한 앱 설정 (local 과 동일한 데모 기본값)
app:
  jwt:
    secret: test-only-jwt-secret-please-use-32-bytes-minimum
    expiration-ms: 86400000
  crypto:
    aes-key: "0123456789abcdef0123456789abcdef"
  blockchain:
    rpc-url: http://127.0.0.1:8545
    operator-private-key: ${OPERATOR_PK:}
    factory-address: 0x5FbDB2315678afecb367f032d93F642f64180aa3
    chain-id: 31337
    default-token-address:
  monitoring:
    large-trade-ratio-percent: 10.0
    rapid-repeat-window-seconds: 60
    rapid-repeat-threshold: 3
